<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicle | sativa/cfd</title>
    <meta name="description" content="Chronicle — Discord utility and security bot by sativa. Moderation, logging, AI interaction.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06060c;
            --fg: #e4e4e7;
            --acc: #c4a35a;
            --border: rgba(255,255,255,0.05);
            --card: rgba(16,14,22,0.85);
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --sans: 'Inter', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--sans);
            min-height: 100vh;
            overflow-x: hidden;
        }
        nav {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 80px);
            max-width: 1100px;
            height: 60px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 100;
        }
        .nav-brand {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 0.9rem;
            color: #fafafa;
            text-decoration: none;
        }
        .nav-links { display: flex; align-items: center; gap: 28px; }
        .nav-links a { color: #52525b; font-size: 0.8rem; text-decoration: none; font-family: var(--mono); transition: color 0.2s; }
        .nav-links a:hover { color: #a1a1aa; }
        .nav-links a.active { color: var(--acc); }
        .nav-socials { display: flex; gap: 10px; }
        .nav-btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px;
            border-radius: 8px; font-size: 0.75rem; font-family: var(--mono);
            text-decoration: none; border: 1px solid var(--border); color: #71717a;
            background: rgba(255,255,255,0.02); transition: all 0.2s;
        }
        .nav-btn:hover { border-color: rgba(255,255,255,0.1); color: #d4d4d8; }
        .hero {
            position: relative; z-index: 1;
            padding: 160px 24px 120px;
            max-width: 640px;
            margin: 0 auto;
            text-align: center;
        }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 14px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.03);
            font-family: var(--mono); font-size: 0.7rem; color: #a1a1aa;
            margin-bottom: 28px; letter-spacing: 0.1em;
        }
        .hero-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--acc); }
        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 900;
            letter-spacing: -0.03em; line-height: 1; margin-bottom: 20px;
            color: #fafafa;
        }
        .hero-sub { max-width: 500px; font-size: 1rem; color: #71717a; line-height: 1.7; margin-bottom: 40px; }
        .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .btn-primary {
            display: inline-flex; align-items: center; gap: 8px; padding: 13px 28px;
            border-radius: 10px; font-size: 0.85rem; font-weight: 700; font-family: var(--mono);
            text-decoration: none; background: var(--acc); color: #0a0a0a; border: none; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: #d4b36a; transform: translateY(-2px); }
        .btn-ghost {
            display: inline-block; padding: 13px 28px;
            border-radius: 10px; font-size: 0.85rem; font-weight: 700; font-family: var(--mono);
            text-decoration: none; background: transparent; color: #a1a1aa;
            border: 1px solid var(--border); cursor: pointer; transition: all 0.2s;
        }
        .btn-ghost:hover { border-color: rgba(255,255,255,0.12); color: #e4e4e7; transform: translateY(-2px); }
        .btn-disabled { cursor: not-allowed; opacity: 0.4; pointer-events: none; }
        .section { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 80px 24px; }
        .section-label { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.25em; color: var(--acc); text-transform: uppercase; margin-bottom: 12px; }
        .section-title { font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 900; color: #fafafa; margin-bottom: 14px; letter-spacing: -0.02em; }
        .section-desc { font-size: 0.9rem; color: #71717a; max-width: 500px; line-height: 1.7; margin-bottom: 48px; }
        .feat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
        .feat-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            padding: 28px; transition: border-color 0.3s, transform 0.3s;
        }
        .feat-card:hover { border-color: rgba(196,163,90,0.15); transform: translateY(-4px); }
        .feat-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(196,163,90,0.07); border: 1px solid rgba(196,163,90,0.1);
            display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
        }
        .feat-icon svg { color: var(--acc); }
        .feat-card h3 { font-size: 0.95rem; font-weight: 700; color: #f4f4f5; margin-bottom: 8px; }
        .feat-card p { font-size: 0.8rem; color: #71717a; line-height: 1.6; }
        footer {
            position: relative; z-index: 1; border-top: 1px solid var(--border);
            padding: 28px 24px; display: flex; align-items: center;
            justify-content: space-between; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; gap: 12px;
        }
        footer span { font-family: var(--mono); font-size: 0.72rem; color: #3f3f46; }
        .footer-links { display: flex; gap: 20px; }
        .footer-links a { font-family: var(--mono); font-size: 0.72rem; color: #52525b; text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: #a1a1aa; }
        @media (max-width: 700px) {
            nav { width: calc(100% - 32px); padding: 0 18px; }
            .nav-links { display: none; }
        }
    </style>
</head>
