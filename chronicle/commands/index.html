<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands | Chronicle</title>
    <meta name="description" content="Chronicle Discord bot — full command reference with categories, triggers, and descriptions.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06060c;
            --fg: #e4e4e7;
            --acc: #c4a35a;
            --border: rgba(255,255,255,0.05);
            --card: rgba(16,14,22,0.85);
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --sans: 'Inter', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--fg); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }

        nav {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 80px); max-width: 1100px; height: 60px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px; z-index: 100;
        }
        .nav-brand { font-family: var(--mono); font-weight: 700; font-size: 0.9rem; color: #fafafa; text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 28px; }
        .nav-links a { color: #52525b; font-size: 0.8rem; text-decoration: none; font-family: var(--mono); transition: color 0.2s; }
        .nav-links a:hover { color: #a1a1aa; }
        .nav-links a.active { color: var(--acc); }
        .nav-back {
            display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px;
            border-radius: 8px; font-size: 0.75rem; font-family: var(--mono);
            text-decoration: none; border: 1px solid var(--border); color: #71717a;
            background: rgba(255,255,255,0.02); transition: all 0.2s;
        }
        .nav-back:hover { border-color: rgba(255,255,255,0.1); color: #d4d4d8; }

        main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 140px 24px 80px; }

        .page-header { margin-bottom: 48px; }
        .page-title { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 900; color: #fafafa; letter-spacing: -0.03em; margin-bottom: 8px; }
        .page-sub { font-family: var(--mono); font-size: 0.75rem; color: #52525b; }
        .page-sub .count { color: var(--acc); font-weight: 700; }

        .controls { display: flex; gap: 12px; margin-bottom: 36px; }
        .search-wrap { position: relative; flex: 1; }
        .search-input {
            width: 100%; padding: 14px 18px 14px 42px;
            border-radius: 12px; border: 1px solid var(--border);
            background: var(--card); color: #fafafa; font-family: var(--mono);
            font-size: 0.85rem; outline: none; transition: border-color 0.2s;
        }
        .search-input:focus { border-color: rgba(196,163,90,0.3); }
        .search-input::placeholder { color: #3f3f46; }
        .search-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            pointer-events: none; display: flex; align-items: center;
        }
        .search-icon svg { width: 14px; height: 14px; color: #52525b; }

        .cat-select {
            padding: 14px 36px 14px 16px;
            border-radius: 12px; border: 1px solid var(--border);
            background: var(--card); color: #fafafa; font-family: var(--mono);
            font-size: 0.82rem; outline: none; cursor: pointer;
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2352525b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat; background-position: right 14px center;
            min-width: 180px; transition: border-color 0.2s;
        }
        .cat-select:focus { border-color: rgba(196,163,90,0.3); }
        .cat-select option { background: #0e0c14; color: #e4e4e7; }

        .empty-state {
            text-align: center; padding: 60px 24px; color: #52525b;
        }
        .empty-state p { font-family: var(--mono); font-size: 0.85rem; }

        .category { margin-bottom: 48px; }
        .category-header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 16px; padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .cat-marker {
            width: 3px; height: 20px; border-radius: 2px;
            background: var(--acc); flex-shrink: 0;
        }
        .cat-name { font-size: 0.9rem; font-weight: 700; color: #d4d4d8; text-transform: capitalize; }
        .cat-count { font-family: var(--mono); font-size: 0.7rem; color: #52525b; }

        .cmd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

        .cmd-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 14px 16px;
            transition: border-color 0.2s, transform 0.2s, background 0.2s;
            display: flex; align-items: flex-start; gap: 10px;
            cursor: pointer;
        }
        .cmd-card:hover { border-color: rgba(196,163,90,0.2); transform: translateY(-1px); background: rgba(16,14,22,0.95); }

        .cmd-slash-badge {
            flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%;
            margin-top: 5px; background: #3f3f46;
        }
        .cmd-slash-badge.slash { background: var(--acc); box-shadow: 0 0 6px rgba(196,163,90,0.4); }

        .cmd-body { min-width: 0; }
        .cmd-trigger {
            font-family: var(--mono); font-weight: 700; font-size: 0.82rem;
            color: #f4f4f5; margin-bottom: 2px; word-break: break-word;
        }
        .cmd-desc { font-size: 0.72rem; color: #71717a; line-height: 1.5; }

        .badge {
            display: inline-block; font-family: var(--mono); font-size: 0.6rem;
            padding: 2px 6px; border-radius: 4px;
            background: rgba(196,163,90,0.1); color: var(--acc);
            margin-left: 6px; vertical-align: middle;
        }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }

        .modal {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; width: 90%; max-width: 500px;
            padding: 32px; position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        .modal-close {
            position: absolute; top: 16px; right: 20px;
            background: none; border: none; color: #52525b;
            font-size: 1.5rem; cursor: pointer; font-family: var(--sans);
            line-height: 1; transition: color 0.2s; padding: 4px 8px;
        }
        .modal-close:hover { color: #a1a1aa; }

        .modal-cmd-name {
            font-family: var(--mono); font-size: 1.3rem; font-weight: 700;
            color: #fafafa; margin-bottom: 6px; word-break: break-word;
        }
        .modal-cmd-cat {
            display: inline-block; font-family: var(--mono); font-size: 0.68rem;
            padding: 3px 10px; border-radius: 4px; text-transform: capitalize;
            background: rgba(196,163,90,0.08); color: var(--acc);
            margin-bottom: 20px;
        }
        .modal-section { margin-bottom: 18px; }
        .modal-label {
            font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.15em;
            color: #52525b; text-transform: uppercase; margin-bottom: 6px;
        }
        .modal-desc { font-size: 0.85rem; color: #a1a1aa; line-height: 1.7; }
        .modal-syntax {
            background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            border-radius: 8px; padding: 14px 18px; font-family: var(--mono);
            font-size: 0.82rem; color: #d4d4d8;
        }
        .modal-syntax .hl { color: var(--acc); }
        .modal-syntax .dim { color: #52525b; }
        .modal-type-row {
            display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 0.78rem;
        }
        .type-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        .type-dot.prefix { background: #52525b; }
        .type-dot.slash { background: var(--acc); box-shadow: 0 0 6px rgba(196,163,90,0.4); }

        footer {
            position: relative; z-index: 1; border-top: 1px solid var(--border);
            padding: 28px 24px; display: flex; align-items: center;
            justify-content: space-between; max-width: 1100px; margin: 0 auto;
            flex-wrap: wrap; gap: 12px;
        }
        footer span { font-family: var(--mono); font-size: 0.72rem; color: #3f3f46; }
        .footer-links { display: flex; gap: 20px; }
        .footer-links a { font-family: var(--mono); font-size: 0.72rem; color: #52525b; text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: #a1a1aa; }

        @media (max-width: 700px) {
            nav { width: calc(100% - 32px); padding: 0 18px; }
            .nav-links { display: none; }
            .cmd-grid { grid-template-columns: 1fr; }
            .controls { flex-direction: column; }
            .cat-select { min-width: auto; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/chronicle/" class="nav-brand">chronicle</a>
        <div class="nav-links">
            <a href="/chronicle/">home</a>
            <a href="/chronicle/commands/" class="active">commands</a>
            <a href="/chronicle/tos/">terms</a>
            <a href="/chronicle/policy/">privacy</a>
        </div>
        <a href="/chronicle/" class="nav-back">&larr; back</a>
    </nav>

    <main>
        <div class="page-header">
            <h1 class="page-title">Commands</h1>
            <p class="page-sub">
                <span class="count" id="total-count">--</span> commands across
                <span class="count" id="cat-count">--</span> categories
            </p>
        </div>

        <div class="controls">
            <div class="search-wrap">
                <span class="search-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </span>
                <input type="text" class="search-input" id="search" placeholder="search commands..." autocomplete="off">
            </div>
            <select class="cat-select" id="cat-filter">
                <option value="all">all categories</option>
            </select>
        </div>

        <div class="empty-state" id="empty-state" style="display:none;">
            <p>no commands match your search</p>
        </div>

        <div id="commands-container"></div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-cmd-name" id="modal-name"></div>
            <div class="modal-cmd-cat" id="modal-cat"></div>

            <div class="modal-section">
                <div class="modal-label">Description</div>
                <div class="modal-desc" id="modal-desc"></div>
            </div>

            <div class="modal-section">
                <div class="modal-label">Type</div>
                <div class="modal-type-row" id="modal-type"></div>
            </div>

            <div class="modal-section">
                <div class="modal-label">Usage</div>
                <div class="modal-syntax" id="modal-syntax"></div>
            </div>
        </div>
    </div>

    <footer>
        <span>&copy; 2026 sativa/cfd &middot; chronicle</span>
        <div class="footer-links">
            <a href="/chronicle/tos/">terms of service</a>
            <a href="/chronicle/policy/">privacy policy</a>
            <a href="/">&larr; home</a>
        </div>
    </footer>

    <script>
        const CAT_ORDER = ['moderation', 'economy', 'fun', 'music', 'roleplay', 'tickets', 'general', 'utility'];

        let allCommands = {};

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function countTotal(data) {
            let n = 0;
            for (const k in data) n += data[k].length;
            return n;
        }

        function populateDropdown(data) {
            const sel = document.getElementById('cat-filter');
            // keep "all" option, rebuild rest
            while (sel.options.length > 1) sel.remove(1);
            CAT_ORDER.forEach(cat => {
                if (data[cat] && data[cat].length > 0) {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat + ' (' + data[cat].length + ')';
                    sel.appendChild(opt);
                }
            });
        }

        function render(data) {
            const container = document.getElementById('commands-container');
            const searchVal = document.getElementById('search').value.toLowerCase().trim();
            const catFilter = document.getElementById('cat-filter').value;

            container.innerHTML = '';

            let totalVisible = 0;
            let anyCategoryVisible = false;

            const categories = CAT_ORDER.filter(c => data[c] && data[c].length > 0);

            categories.forEach(cat => {
                if (catFilter !== 'all' && cat !== catFilter) return;

                let cmds = data[cat];

                if (searchVal) {
                    cmds = cmds.filter(c =>
                        c.trigger.toLowerCase().includes(searchVal) ||
                        c.description.toLowerCase().includes(searchVal)
                    );
                }

                if (cmds.length === 0) return;
                anyCategoryVisible = true;

                const section = document.createElement('div');
                section.className = 'category';

                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML =
                    '<div class="cat-marker"></div>' +
                    '<span class="cat-name">' + cat + '</span>' +
                    '<span class="cat-count">' + cmds.length + ' commands</span>';
                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'cmd-grid';

                cmds.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'cmd-card';
                    card.innerHTML =
                        '<span class="cmd-slash-badge' + (c.slash ? ' slash' : '') + '" title="' + (c.slash ? 'Slash command' : 'Prefix command') + '"></span>' +
                        '<div class="cmd-body">' +
                            '<div class="cmd-trigger">.' + esc(c.trigger) + (c.slash ? '<span class="badge">/</span>' : '') + '</div>' +
                            '<div class="cmd-desc">' + esc(c.description) + '</div>' +
                        '</div>';
                    card.addEventListener('click', () => openModal(c));
                    grid.appendChild(card);
                    totalVisible++;
                });

                section.appendChild(grid);
                container.appendChild(section);
            });

            document.getElementById('empty-state').style.display = anyCategoryVisible ? 'none' : 'block';
            document.getElementById('total-count').textContent = totalVisible;
        }

        function openModal(cmd) {
            document.getElementById('modal-name').textContent = '.' + cmd.trigger;
            document.getElementById('modal-cat').textContent = cmd.category;
            document.getElementById('modal-desc').textContent = cmd.description;

            const typeRow = document.getElementById('modal-type');
            if (cmd.slash) {
                typeRow.innerHTML =
                    '<span class="type-dot slash"></span> Slash command <span style="color:#52525b;margin-left:6px;">(also available as prefix)</span>';
            } else {
                typeRow.innerHTML =
                    '<span class="type-dot prefix"></span> Prefix command <span style="color:#52525b;margin-left:6px;">(.trigger)</span>';
            }

            const syntaxEl = document.getElementById('modal-syntax');
            let syntaxHtml = '<span class="hl">.' + esc(cmd.trigger) + '</span>';
            if (cmd.slash) {
                syntaxHtml += '\n<span class="hl">/' + esc(cmd.trigger) + '</span>';
            }
            syntaxHtml += ' <span class="dim">-- triggers the command</span>';
            syntaxEl.innerHTML = syntaxHtml;

            const overlay = document.getElementById('modal-overlay');
            overlay.classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        // Init
        (async () => {
            try {
                const res = await fetch('https://raw.githubusercontent.com/sativacdf/storage/refs/heads/main/commands_export.json');
                allCommands = await res.json();
            } catch (e) { allCommands = {}; }

            document.getElementById('total-count').textContent = countTotal(allCommands);
            document.getElementById('cat-count').textContent = Object.keys(allCommands).length;
            populateDropdown(allCommands);
            render(allCommands);
        })();

        document.getElementById('search').addEventListener('input', () => render(allCommands));
        document.getElementById('cat-filter').addEventListener('change', () => render(allCommands));
        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal-overlay')) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
